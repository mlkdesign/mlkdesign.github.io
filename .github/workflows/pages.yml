name: Deploy to GitHub Pages

# The published site combines this branch (root) with the milka-cv branch (/milka-cv/, /upwork/).
# That assembly lives in the milka-cv workflow, so a push here asks it to redeploy instead of
# publishing this branch alone, which would remove the other versions.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the combined site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref milka-cv
