name: Deploy both portfolio versions to GitHub Pages

on:
  push:
    branches:
      - milka-cv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/milka-cv'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}milka-cv/
    steps:
      - name: Check out original studio website
        uses: actions/checkout@v4
        with:
          ref: main
          path: original
          persist-credentials: false

      - name: Check out personal portfolio
        uses: actions/checkout@v4
        with:
          path: personal
          persist-credentials: false

      - name: Assemble both versions without changing either branch
        shell: bash
        run: |
          set -euo pipefail
          # Reserve the personal path; never overwrite a path owned by main.
          for reserved in milka-cv upwork; do
            if git -C original cat-file -e "HEAD:$reserved" 2>/dev/null; then
              echo "The original site already owns /$reserved; refusing to overwrite it." >&2
              exit 1
            fi
          done
          mkdir -p _site/milka-cv
          git -C original archive HEAD | tar -x -C _site
          git -C personal archive HEAD | tar -x -C _site/milka-cv
          test -s _site/index.html
          test -s _site/milka-cv/index.html
          test -s _site/milka-cv/case.html
          # Contact-free Upwork edition lives at the site root (/upwork/) and loads shared files from /milka-cv/.
          mv _site/milka-cv/upwork _site/upwork
          test -s _site/upwork/index.html
          test -s _site/upwork/Jack-Milka-CV.pdf
          # Forward the earlier /milka-cv/upwork/ address to the new location.
          mkdir -p _site/milka-cv/upwork
          printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Jack Milka</title><link rel="canonical" href="https://mlkdesign.github.io/upwork/"><meta http-equiv="refresh" content="0; url=/upwork/"></head><body><a href="/upwork/">mlkdesign.github.io/upwork</a></body></html>' > _site/milka-cv/upwork/index.html
          # Deployment metadata and build sources are not public site content.
          rm -rf _site/.github _site/.claude _site/milka-cv/.github _site/milka-cv/.claude _site/milka-cv/tools
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both websites
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
