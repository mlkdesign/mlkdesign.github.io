<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="color-scheme" content="dark" />
    <title>Jack Milka — CV · UI/UX &amp; Digital Product Designer</title>
    <meta name="description" content="CV of Jack Milka, UI/UX &amp; Digital Product Designer based in Warsaw. View it in the browser or download the PDF in English or Russian." />
    <link rel="canonical" href="https://mlkdesign.github.io/milka-cv/cv/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mlkdesign.github.io/milka-cv/cv/" />
    <meta property="og:title" content="Jack Milka — CV" />
    <meta property="og:description" content="UI/UX &amp; Digital Product Designer. View or download the CV in English or Russian." />
    <meta property="og:image" content="https://mlkdesign.github.io/milka-cv/assets/cv/preview/en-1.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="../assets/jm-favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0b0b0b;
        --text: #f4efe3;
        --text-soft: rgba(244, 239, 227, 0.72);
        --rule: rgba(244, 239, 227, 0.14);
        --accent: #ff5a1f;
        --font: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --inset: 30px;
        --bar: 72px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 300 15px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      a,
      button {
        color: inherit;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }

      :focus-visible {
        outline: 1px solid var(--text);
        outline-offset: 4px;
      }

      /* Rolling label, same treatment as the site navigation. */
      .roll {
        display: inline-block;
        height: 1.2em;
        overflow: hidden;
        line-height: 1.2;
        vertical-align: top;
      }

      .roll > span {
        display: block;
        transition: transform 0.3s ease-in-out;
      }

      .roll > span + span {
        margin-top: 5px;
      }

      :is(a, button):hover .roll > span,
      :is(a, button):focus-visible .roll > span {
        transform: translateY(calc(-100% - 5px));
      }

      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 20px;
        height: calc(var(--bar) + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0px) var(--inset) 0;
        border-bottom: 1px solid var(--rule);
        background: rgba(11, 11, 11, 0.86);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }

      .brand {
        justify-self: start;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        text-decoration: none;
      }

      .bar__nav {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 0.82rem;
        letter-spacing: 0.14em;
      }

      .link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        opacity: 0.6;
        transition: opacity 0.3s var(--ease);
      }

      .link:hover,
      .link:focus-visible {
        opacity: 1;
      }

      .link img {
        width: 16px;
        height: 16px;
        filter: brightness(0) invert(1);
        transform: scaleX(-1);
      }

      .langs {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .langs button {
        opacity: 0.45;
        letter-spacing: 0.14em;
        transition: opacity 0.3s var(--ease);
      }

      .langs button:hover,
      .langs button:focus-visible,
      .langs button[aria-pressed="true"] {
        opacity: 1;
      }

      .langs span {
        opacity: 0.35;
      }

      .actions {
        justify-self: end;
        display: flex;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 40px;
        padding: 0 18px;
        border: 1px solid transparent;
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 0.3s var(--ease), border-color 0.3s var(--ease), color 0.3s var(--ease);
      }

      .btn svg {
        flex: none;
        width: 14px;
        height: 14px;
      }

      .btn--primary {
        background: var(--accent);
        color: #fff;
      }

      .btn--primary:hover,
      .btn--primary:focus-visible {
        background: color-mix(in srgb, var(--accent) 86%, #000);
      }

      .btn--ghost {
        border-color: rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.6);
      }

      .btn--ghost:hover,
      .btn--ghost:focus-visible {
        border-color: #fff;
        color: #fff;
      }

      .viewer {
        display: flex;
        justify-content: center;
        padding: 24px var(--inset) 40px;
      }

      .doc {
        width: 100%;
        max-width: 1100px;
        opacity: 0;
        transform: translate3d(0, 18px, 0);
        transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
      }

      .doc.is-ready {
        opacity: 1;
        transform: none;
      }

      .doc__frame {
        display: block;
        width: 100%;
        height: calc(100dvh - var(--bar) - env(safe-area-inset-top, 0px) - 64px);
        min-height: 520px;
        border: 0;
        background: #fff;
      }

      .pages {
        display: grid;
        gap: 16px;
        max-width: 820px;
        margin: 0 auto;
      }

      .pages img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 210 / 297;
        background: #fff;
      }

      .fallback {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 820px;
        margin: 0 auto 16px;
        color: var(--text-soft);
        font-size: 0.82rem;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 960px) {
        .bar {
          grid-template-columns: 1fr auto;
          height: auto;
          row-gap: 12px;
          padding-top: calc(16px + env(safe-area-inset-top, 0px));
          padding-bottom: 14px;
        }

        .bar__nav {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-content: space-between;
        }

        .actions {
          grid-row: 1;
          grid-column: 2;
        }
      }

      @media (max-width: 560px) {
        :root {
          --inset: 16px;
        }

        .btn {
          height: 36px;
          padding: 0 12px;
        }

        .btn__text--long {
          display: none;
        }

        .viewer {
          padding-top: 16px;
        }

        .pages {
          gap: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .doc,
        .roll > span {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="../">JACK MILKA</a>
      <nav class="bar__nav" aria-label="CV navigation">
        <a class="link" href="../">
          <img src="../assets/caret-right.svg" alt="" aria-hidden="true" />
          <span class="roll"><span data-i18n="back">back to website</span><span data-i18n="back" aria-hidden="true">back to website</span></span>
        </a>
        <div class="langs" role="group" aria-label="CV language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        </div>
      </nav>
      <div class="actions">
        <a class="btn btn--ghost" data-open href="../assets/cv/Jack-Milka-CV-EN.pdf" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.2" /></svg>
          <span class="roll btn__text--long"><span data-i18n="open">open PDF</span><span data-i18n="open" aria-hidden="true">open PDF</span></span>
        </a>
        <a class="btn btn--primary" data-download href="../assets/cv/Jack-Milka-CV-EN.pdf" download="Jack-Milka-CV-EN.pdf">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5v9M4 7l4 4 4-4M2 14.5h12" stroke="currentColor" stroke-width="1.2" /></svg>
          <span class="roll"><span data-i18n="download">download PDF</span><span data-i18n="download" aria-hidden="true">download PDF</span></span>
        </a>
      </div>
    </header>

    <main class="viewer">
      <div class="doc">
        <iframe class="doc__frame" data-frame title="Jack Milka — CV (PDF)" hidden></iframe>
        <div data-fallback hidden>
          <p class="fallback">
            <span data-i18n="fallbackNote">Preview of the PDF. Open it to zoom, select text and use links.</span>
            <a class="btn btn--ghost" data-open href="../assets/cv/Jack-Milka-CV-EN.pdf" target="_blank" rel="noopener">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.2" /></svg>
              <span data-i18n="open">open PDF</span>
            </a>
          </p>
          <div class="pages" data-pages></div>
        </div>
      </div>
    </main>

    <script>
      const FILES = { en: '../assets/cv/Jack-Milka-CV-EN.pdf', ru: '../assets/cv/Jack-Milka-CV-RU.pdf' };
      const UI = {
        en: { back: 'back to website', download: 'download PDF', open: 'open PDF', fallbackNote: 'Preview of the PDF. Open it to zoom, select text and use links.', page: 'CV page', title: 'Jack Milka — CV · UI/UX & Digital Product Designer' },
        ru: { back: 'назад на сайт', download: 'скачать PDF', open: 'открыть PDF', fallbackNote: 'Превью PDF. Откройте файл, чтобы масштабировать, копировать текст и переходить по ссылкам.', page: 'Страница резюме', title: 'Jack Milka — Резюме · UI/UX и продуктовый дизайнер' },
      };

      const frame = document.querySelector('[data-frame]');
      const fallback = document.querySelector('[data-fallback]');
      const pagesBox = document.querySelector('[data-pages]');
      const download = document.querySelector('[data-download]');
      const openLinks = document.querySelectorAll('[data-open]');
      const doc = document.querySelector('.doc');

      // Embedded PDFs show only the first page on iOS and are unavailable without a
      // built-in viewer, so those devices get page previews plus a direct "open PDF" link.
      const useNativeViewer = navigator.pdfViewerEnabled === true
        && !window.matchMedia('(pointer: coarse)').matches
        && window.innerWidth > 800;

      let pageCounts = { en: 2, ru: 2 };
      const pagesReady = fetch('../assets/cv/pages.json')
        .then((response) => (response.ok ? response.json() : null))
        .then((data) => { if (data) pageCounts = data; })
        .catch(() => undefined);

      const setLanguage = (lang, { replace = true } = {}) => {
        const t = UI[lang];
        const file = FILES[lang];
        document.documentElement.lang = lang;
        document.title = t.title;
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
        document.querySelectorAll('[data-lang]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
        download.href = file;
        download.setAttribute('download', file.split('/').pop());
        openLinks.forEach((link) => {
          link.href = file;
          link.setAttribute('aria-label', t.open);
        });

        if (useNativeViewer) {
          frame.hidden = false;
          frame.src = `${file}#view=FitH`;
        } else {
          fallback.hidden = false;
          pagesReady.then(() => {
            pagesBox.replaceChildren(...Array.from({ length: pageCounts[lang] || 2 }, (_, index) => {
              const image = new Image(1240, 1754);
              image.src = `../assets/cv/preview/${lang}-${index + 1}.jpg`;
              image.alt = `${t.page} ${index + 1}`;
              image.loading = index === 0 ? 'eager' : 'lazy';
              image.decoding = 'async';
              return image;
            }));
          });
        }

        if (replace) {
          const url = new URL(location.href);
          if (lang === 'en') url.searchParams.delete('lang');
          else url.searchParams.set('lang', lang);
          history.replaceState(null, '', url);
        }
      };

      const initial = new URLSearchParams(location.search).get('lang') === 'ru' ? 'ru' : 'en';
      setLanguage(initial, { replace: false });
      requestAnimationFrame(() => doc.classList.add('is-ready'));

      document.querySelectorAll('[data-lang]').forEach((button) => {
        button.addEventListener('click', () => setLanguage(button.dataset.lang));
      });
    </script>
  </body>
</html>
