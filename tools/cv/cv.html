      }

        letter-spacing: -0.01em;

        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 2.6mm var(--gap);
        margin-top: 6.5mm;
        padding-top: 3.5mm;
        border-top: 0.6pt solid var(--ink);
      }

      .contacts div {
        display: grid;
        gap: 0.6mm;
        min-width: 0;
      }

      .label {
        color: var(--mute);
        font-size: 6.6pt;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .contacts a,

      .section {
        display: grid;
        grid-template-columns: var(--label-col) minmax(0, 1fr);
        column-gap: var(--gap);
        margin-top: 5.5mm;
        padding-top: 3mm;
        border-top: 0.6pt solid var(--rule);

        align-content: start;
        gap: 0.8mm;

      .section__index {
        color: var(--mute);
        font-size: 6.6pt;
        letter-spacing: 0.14em;

      .section__title {
        font-size: 7.2pt;

      .summary {

        font-weight: 300;
        line-height: 1.48;

      .groups {

        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3.5mm var(--gap);

      .group h3 {
        margin-bottom: 0.8mm;
        font-size: 8.6pt;
        font-weight: 500;

      .group p {
        color: var(--soft);

      .tools {
        color: var(--soft);

      .tools span + span::before {
        content: " · ";
        color: var(--mute);
      }

      .jobs {
        display: grid;
        gap: 3.4mm;
      }

      .job {
        break-inside: avoid;
      }

      .job__top {
        display: flex;
        justify-content: space-between;
        gap: 4mm;
        align-items: baseline;
      }

      .job__title {
        font-size: 9.6pt;
        font-weight: 500;
      }

      .job__title span {
        font-weight: 300;
      }

      .job__period {
        flex: none;
        color: var(--soft);
        font-size: 7.6pt;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }

      .job__meta {
        margin-top: 0.4mm;
        color: var(--mute);
        font-size: 7.4pt;
        letter-spacing: 0.04em;
      }

      .job ul,
      .project p {
        margin-top: 1.2mm;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding-left: 4mm;
        color: var(--soft);
      }

      li + li {
        margin-top: 0.6mm;
      }

      li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.72em;
        width: 2.2mm;
        border-top: 0.6pt solid var(--mute);

        font-size: 7.4pt;

      .rows {

        gap: 1.2mm;

      .rows div {

        grid-template-columns: 34mm minmax(0, 1fr);
        gap: var(--gap);

      .rows dt {

      .rows dd {
        margin: 0;

      dl {

      .langs {

        grid-template-columns: repeat(3, minmax(0, 1fr));

      .langs dt {
        font-weight: 500;
      }

      .langs dd {
        margin: 0.4mm 0 0;
        color: var(--soft);
      }

      .keep {
        break-inside: avoid;
      }
    </style>
  </head>
